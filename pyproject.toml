[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-generator"
version = "0.1.2"
description = "Offline image → mesh (GLB) for Unity; placeholder pipeline for future AI + rigging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "trimesh[easy]>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
