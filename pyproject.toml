[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-generator-cli"
version = "0.1.2"
description = "Batch CLI pipeline for Hunyuan3D-2 creature model generation."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "tqdm>=4.66",
]

[project.scripts]
model-factory = "model_generator_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
